<div class="field"><span class="field-label">Tasks and pictures</span><ol class="rt-steps" id="rw-steps" aria-label="Tasks in order"></ol></div>
<details class="rt-lib"><summary>Add tasks from the picture library</summary><div class="rt-grid" id="rw-grid" role="group" aria-label="Picture library"></div></details>
<div class="row">
  <div class="field"><label for="rw-days">Days</label><select id="rw-days" name="days"><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option></select></div>
  <div class="field"><label for="rw-mark">Spots</label><select id="rw-mark" name="mark"><option value="sticker">Sticker circles</option><option value="tick">Tick boxes</option></select></div>
</div>
<div class="row">
  <div class="field"><label for="rw-palette">Colors</label><select id="rw-palette" name="palette"><option value="mint">Mint</option><option value="sky">Sky</option><option value="peach">Peach</option><option value="lavender">Lavender</option><option value="bw">Black and white</option></select></div>
  <div class="field"><label for="rw-week">Week starts</label><select id="rw-week" name="weekStart"><option value="mon">Monday</option><option value="sun">Sunday</option></select></div>
</div>
<div class="field"><label for="rw-name">Child's name <small>(optional)</small></label><input type="text" id="rw-name" name="name" maxlength="24" placeholder="Leo"></div>
<div class="field"><label for="rw-goal">Reward <small>(optional)</small></label><input type="text" id="rw-goal" name="goal" maxlength="80" placeholder="A trip to the park"></div>
