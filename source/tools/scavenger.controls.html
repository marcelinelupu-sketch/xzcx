<div class="row">
  <div class="field"><label for="sv-layout">Layout</label><select id="sv-layout" name="layout"><option value="checklist">Checklist</option><option value="two-column">Two columns</option><option value="photo">Photo hunt</option><option value="team">Team score sheet</option></select></div>
  <div class="field"><label for="sv-copies">Copies</label><input type="number" id="sv-copies" name="copies" min="1" max="30" value="1" inputmode="numeric"></div>
</div>
<div class="field"><label for="sv-age">Note under the title <small>(optional)</small></label><input type="text" id="sv-age" name="ageNote" maxlength="80" placeholder="Ages 5 to 9, stay where you can see a grown-up"></div>
<label class="check"><input type="checkbox" id="sv-names" name="names" checked> Team and player name lines</label>
<label class="check"><input type="checkbox" id="sv-time" name="timeLimit"> Time limit, start and finish lines</label>
<label class="check"><input type="checkbox" id="sv-shuffle" name="shuffle" checked> Mix up the order on each copy</label>
