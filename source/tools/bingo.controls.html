<div class="row">
  <div class="field"><label for="bg-mode">Bingo type</label><select id="bg-mode" name="mode"><option value="word">Word bingo</option><option value="75">75-ball numbers</option><option value="90">90-ball UK tickets</option><option value="30">Numbers 1 to 30</option></select></div>
  <div class="field x75 x90"><label for="bg-grid">Grid</label><select id="bg-grid" name="grid"><option value="3">3 x 3</option><option value="4">4 x 4</option><option value="5" selected>5 x 5</option></select></div>
</div>
<div class="row">
  <div class="field"><label for="bg-cards" id="bg-cards-l">Cards</label><input type="number" id="bg-cards" name="cards" min="1" max="30" value="10" inputmode="numeric"></div>
  <div class="field x90"><label for="bg-per">Cards per page</label><select id="bg-per" name="perPage"><option value="1">1</option><option value="2" selected>2</option><option value="4">4</option></select></div>
</div>
<label class="check x90"><input type="checkbox" id="bg-free" name="free" checked> Free center square (3 x 3 and 5 x 5)</label>
<div class="field x90"><label for="bg-ftext">Free square text</label><input type="text" id="bg-ftext" name="freeText" maxlength="20" value="FREE"></div>
<label class="check x75 x90 x30"><input type="checkbox" id="bg-rep" name="repeats"> Allow repeats if the list is short</label>
<label class="check x75 x90 x30"><input type="checkbox" id="bg-names" name="names"> Name line in each square (find someone who)</label>
<label class="check"><input type="checkbox" id="bg-caller" name="caller" checked> Caller sheet with a checklist and call order</label>
