<div class="row">
  <div class="field"><label for="sc-puzzles">Puzzles</label><input type="number" id="sc-puzzles" name="puzzles" min="1" max="10" value="1" inputmode="numeric"></div>
  <div class="field"><label for="sc-case">Letters</label><select id="sc-case" name="case"><option value="upper">UPPERCASE</option><option value="lower">lowercase</option></select></div>
</div>
<label class="check"><input type="checkbox" id="sc-hint" name="hint"> Hint: show the first letter</label>
<label class="check"><input type="checkbox" id="sc-bank" name="bank" checked> Word bank at the bottom</label>
<label class="check"><input type="checkbox" id="sc-key" name="key" checked> Answer key page</label>
<label class="check"><input type="checkbox" id="sc-shuffle" name="shuffle" checked> Mix up the word order</label>
