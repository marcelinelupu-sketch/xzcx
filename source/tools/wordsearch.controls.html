<div class="row">
  <div class="field"><label for="ws-size">Grid size</label><select id="ws-size" name="size"><option value="10">10 by 10</option><option value="11">11 by 11</option><option value="12" selected>12 by 12</option><option value="13">13 by 13</option><option value="14">14 by 14</option><option value="15">15 by 15</option><option value="16">16 by 16</option><option value="17">17 by 17</option><option value="18">18 by 18</option><option value="19">19 by 19</option><option value="20">20 by 20</option></select></div>
  <div class="field"><label for="ws-difficulty">Difficulty</label><select id="ws-difficulty" name="difficulty"><option value="easy">Easy: across, down</option><option value="medium" selected>Medium: plus diagonals</option><option value="hard">Hard: all 8 ways</option></select></div>
</div>
<div class="row">
  <div class="field"><label for="ws-puzzles">Puzzles</label><input type="number" id="ws-puzzles" name="puzzles" min="1" max="10" value="1" inputmode="numeric"></div>
  <div class="field"><label for="ws-case">Letters</label><select id="ws-case" name="case"><option value="upper">UPPERCASE</option><option value="lower">lowercase</option></select></div>
</div>
<label class="check"><input type="checkbox" id="ws-list" name="showList" checked> Show the word list</label>
<label class="check"><input type="checkbox" id="ws-key" name="key" checked> Answer key page</label>
