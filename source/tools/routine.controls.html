<div class="field"><span class="field-label">Steps and pictures</span><ol class="rt-steps" id="rt-steps" aria-label="Steps in order"></ol></div>
<details class="rt-lib"><summary>Add steps from the picture library</summary><div class="rt-grid" id="rt-grid" role="group" aria-label="Picture library"></div></details>
<div class="row">
  <div class="field"><label for="rt-layout">Layout</label><select id="rt-layout" name="layout"><option value="strip">Step by step</option><option value="grid">Two-column grid</option><option value="weekly">Weekly tick chart</option></select></div>
  <div class="field"><label for="rt-palette">Colors</label><select id="rt-palette" name="palette"><option value="lavender">Lavender</option><option value="mint">Mint</option><option value="sky">Sky</option><option value="peach">Peach</option><option value="bw">Black and white</option></select></div>
</div>
<div class="field"><label for="rt-name">Child's name <small>(optional)</small></label><input type="text" id="rt-name" name="name" maxlength="24" placeholder="Mia"></div>
<label class="check"><input type="checkbox" id="rt-times" name="times"> Show a time for each step</label>
<label class="check"><input type="checkbox" id="rt-mascot" name="mascot" checked> Sleepy frog in the corner</label>
